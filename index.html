<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17365d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<title>NCC Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>🚘 NCC Manager</h1><small>Gestione servizi con conducente</small></header>
<nav>
<button class="active" onclick="show('dashboard',this)">🏠 Oggi</button>
<button onclick="show('calendar',this)">📅 Calendario</button>
<button onclick="show('services',this)">📋 Servizi</button>
<button onclick="show('settings',this)">⚙️ Gestione</button>
</nav>
<main>
<section id="dashboard" class="view active">
<div class="card"><h2>Oggi</h2><div class="row"><button class="action" onclick="newService()">＋ Nuovo servizio</button><button class="action light" onclick="show('calendar',document.querySelectorAll('nav button')[1])">Apri calendario</button></div></div>
<div id="todayList"></div>
</section>

<section id="calendar" class="view">
<div class="card">
<div class="month"><button class="action light" onclick="changeMonth(-1)">‹</button><strong id="monthTitle"></strong><button class="action light" onclick="changeMonth(1)">›</button></div>
<div class="calendar" id="calendarGrid"></div>
</div>
</section>

<section id="services" class="view">
<div class="card"><h2>Archivio servizi</h2><input id="search" placeholder="Cerca cliente, partenza, destinazione..." oninput="renderServices()"></div>
<div id="serviceList"></div>
</section>

<section id="settings" class="view">
<div class="card"><h2>Autisti</h2><div id="drivers"></div><div class="grid" style="margin-top:10px"><input id="newDriver" placeholder="Nome autista"><input id="newDriverPhone" placeholder="Telefono"><button class="action" onclick="addDriver()">Aggiungi autista</button></div></div>
<div class="card"><h2>Auto / Targhe</h2><div id="cars"></div><div class="grid" style="margin-top:10px"><input id="newCar" placeholder="Marca e modello"><input id="newPlate" placeholder="Targa"><button class="action" onclick="addCar()">Aggiungi veicolo</button></div></div>
</section>

<section id="daydetail" class="view">
<div class="card">
<div class="month"><button class="action light" onclick="show('calendar',document.querySelectorAll('nav button')[1])">‹ Calendario</button><strong id="dayTitle"></strong><button class="action" onclick="newServiceForSelectedDay()">＋ Servizio</button></div>
</div>
<div id="dayList"></div>
</section>

<section id="editor" class="view">
<div class="card"><h2>Nuovo servizio</h2>
<div class="grid">
<div><label>Numero servizio</label><input id="numero" readonly></div><div><label>Stato</label><select id="stato"><option>Da confermare</option><option>Confermato</option><option>In corso</option><option>Completato</option><option>Annullato</option></select></div>
<div><label>Data</label><input id="data" type="date"></div><div><label>Ora</label><input id="ora" type="time"></div>
<div><label>Cliente</label><input id="cliente"></div><div><label>Telefono</label><input id="telefono" type="tel"></div>
<div class="full"><label>Partenza</label><input id="partenza"></div><div class="full"><label>Destinazione</label><input id="destinazione"></div>
<div><label>Passeggeri</label><input id="passeggeri" type="number" min="1" value="1"></div><div><label>Volo / treno</label><input id="volo"></div>
<div><label>Autista</label><input id="autista" list="autistiList" autocomplete="off" placeholder="Scrivi il nome dell’autista"><datalist id="autistiList"></datalist></div><div><label>Auto / targa</label><input id="auto" list="autoList" autocomplete="off" placeholder="Scrivi modello o targa"><datalist id="autoList"></datalist></div>

<div class="full"><label>Note</label><textarea id="note"></textarea></div>
</div><div class="row" style="margin-top:14px"><button class="action" onclick="saveService()">Salva servizio</button><button class="action light" onclick="goBack()">Annulla</button></div>
</div></section>
</main>
<script src="app.js" defer></script>
</body></html>
